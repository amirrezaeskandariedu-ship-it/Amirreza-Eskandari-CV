<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>داشبورد کنترل پروژه — MediCore Smart General Hospital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --p:#2563eb; --p2:#1d4ed8; --s:#0891b2; --amber:#d97706; --red:#dc2626; --green:#16a34a;
  --bg:#f4f6fb; --bg2:#ffffff; --card:#ffffff; --ink:#0f172a; --ink2:#475569; --ink3:#94a3b8;
  --border:#e2e8f0; --sidebar:#0b1220; --sidebar2:#131c2e; --sidebar-ink:#c9d3e6;
  font-family:'Vazirmatn',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1220; --bg2:#111a2c; --card:#131c2e; --ink:#e7edf7; --ink2:#a9b6cc; --ink3:#6b7994;
    --border:#233047; --sidebar:#070c17; --sidebar2:#0e1526; --sidebar-ink:#c9d3e6;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1220; --bg2:#111a2c; --card:#131c2e; --ink:#e7edf7; --ink2:#a9b6cc; --ink3:#6b7994;
  --border:#233047; --sidebar:#070c17; --sidebar2:#0e1526; --sidebar-ink:#c9d3e6;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);height:100%;}
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
.layout{display:flex;min-height:100vh;}
.sidebar{
  width:260px;flex:0 0 260px;background:linear-gradient(180deg,var(--sidebar),var(--sidebar2));
  color:var(--sidebar-ink);padding:18px 12px;position:sticky;top:0;height:100vh;overflow-y:auto;
  padding-top:calc(18px + env(safe-area-inset-top,0px));
}
.brand{padding:8px 10px 18px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:12px;}
.brand .t1{font-size:13px;color:#8fa2c7;font-weight:600;}
.brand .t2{font-size:16px;font-weight:800;color:#fff;margin-top:4px;line-height:1.4;}
.navitem{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer;
  font-size:13.5px;font-weight:600;color:#aab8d4;margin-bottom:3px;transition:.15s;
}
.navitem .num{
  width:24px;height:24px;border-radius:7px;background:rgba(255,255,255,.06);display:flex;
  align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#7d8db3;flex:0 0 24px;
}
.navitem:hover{background:rgba(255,255,255,.06);color:#fff;}
.navitem.active{background:linear-gradient(90deg,var(--p),var(--p2));color:#fff;}
.navitem.active .num{background:rgba(255,255,255,.2);color:#fff;}
.main{flex:1;min-width:0;padding:22px 26px 60px;max-width:100%;}
.topbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:20px;}
.topbar h1{font-size:20px;margin:0;font-weight:800;}
.badge{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;font-size:12px;font-weight:700;}
.badge.blue{background:#dbeafe;color:#1e40af;}
.badge.amber{background:#fef3c7;color:#92400e;}
.badge.red{background:#fee2e2;color:#991b1b;}
.badge.green{background:#dcfce7;color:#166534;}
:root[data-theme="dark"] .badge.blue,:root:not([data-theme="light"]) .badge.blue{background:#1e3a5f;color:#93c5fd;}
:root[data-theme="dark"] .badge.amber,:root:not([data-theme="light"]) .badge.amber{background:#4a3607;color:#fcd34d;}
:root[data-theme="dark"] .badge.red,:root:not([data-theme="light"]) .badge.red{background:#4c1d1d;color:#fca5a5;}
:root[data-theme="dark"] .badge.green,:root:not([data-theme="light"]) .badge.green{background:#12331f;color:#86efac;}
.section{display:none;}
.section.active{display:block;animation:fade .25s ease;}
@keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
.grid{display:grid;gap:14px;}
.cols-4{grid-template-columns:repeat(4,1fr);}
.cols-3{grid-template-columns:repeat(3,1fr);}
.cols-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:1000px){.cols-4{grid-template-columns:repeat(2,1fr);}.cols-3{grid-template-columns:repeat(2,1fr);}.cols-2{grid-template-columns:1fr;}}
@media(max-width:640px){.cols-4,.cols-3{grid-template-columns:1fr;}.layout{flex-direction:column;}.sidebar{width:100%;flex:none;height:auto;position:relative;}.main{padding:16px;}}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 18px;}
.kpi .label{font-size:12px;color:var(--ink2);font-weight:600;margin-bottom:6px;}
.kpi .value{font-size:26px;font-weight:800;}
.kpi .sub{font-size:11.5px;color:var(--ink3);margin-top:4px;}
.section h2{font-size:17px;font-weight:800;margin:26px 0 12px;padding-right:10px;border-right:4px solid var(--p);}
.section h2:first-child{margin-top:0;}
table{width:100%;border-collapse:collapse;font-size:12.5px;}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--border);}
th{background:var(--bg);color:var(--ink2);font-weight:700;font-size:11.5px;position:sticky;top:0;}
tr:hover td{background:rgba(37,99,235,.04);}
.twrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px;}
.chart-wrap{position:relative;height:260px;}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-left:6px;}
.progress{background:var(--border);border-radius:999px;height:8px;overflow:hidden;}
.progress > div{height:100%;border-radius:999px;}
.flex{display:flex;align-items:center;gap:8px;}
.muted{color:var(--ink2);font-size:12.5px;}
.small{font-size:11.5px;}
.risk-cell{width:36px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:11px;}
ul.plain{margin:8px 0;padding-right:18px;}
ul.plain li{margin-bottom:6px;font-size:13px;line-height:1.7;}
.two-col{display:grid;grid-template-columns:2fr 1fr;gap:14px;}
@media(max-width:900px){.two-col{grid-template-columns:1fr;}}
.footer-note{margin-top:30px;padding-top:14px;border-top:1px solid var(--border);color:var(--ink3);font-size:11.5px;}
</style>
</head>
<body>
<div class="layout">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main">
    <div class="topbar">
      <div>
        <h1>داشبورد مدیریت و کنترل پروژه</h1>
        <div class="muted" style="margin-top:4px">MediCore Smart General Hospital — ساخت بیمارستان عمومی هوشمند ۲۰۰ تخته</div>
      </div>
      <div class="flex">
        <span class="badge blue" id="dataDateBadge">Data Date: —</span>
        <span class="badge" id="statusBadge">وضعیت</span>
      </div>
    </div>
    <div id="sections"></div>
    <div class="footer-note">تهیه‌شده توسط امیررضا اسکندری — داده‌ها مستقیماً از فایل Primavera P6 (.xer) استخراج شده‌اند.</div>
  </main>
</div>

// ---------- fill WBS schedule table (section 03) ----------
(function(){
  const blMap = {
    'Project Management':['2025-01-02','2025-09-25'],
    'Design':['2025-01-09','2025-05-16'],
    'Permits & Regulatory Approval':['2025-02-07','2025-06-24'],
    'Site Preparation & Civil Works':['2025-06-25','2025-08-20'],
    'Structural Construction':['2025-08-21','2025-12-31'],
    'MEP Installation':['2026-01-02','2026-03-09'],
    'Smart-Systems Integration':['2026-03-10','2026-07-23'],
    'Interior Finishing & Medical Fit-out':['2026-03-10','2026-07-30'],
    'Commissioning & Testing':['2026-03-10','2026-08-13'],
    'Accreditation & Handover':['2026-08-14','2026-09-25'],
  };
  const cur = {};
  acts.forEach(a=>{
    const k=a.wbs1; if(!k||!blMap[k]) return;
    const s = a.early_start||a.act_start, e=a.early_end||a.act_end;
    if(!cur[k]) cur[k]={s:s,e:e,wb:a.budget,we:0};
    else{ if(s<cur[k].s) cur[k].s=s; if(e>cur[k].e) cur[k].e=e; }
    cur[k].wb=(cur[k].wb||0); cur[k].we=(cur[k].we||0)+a.budget*(a.phys/100);
  });
  const tb = document.getElementById('wbsSchedBody');
  tb.innerHTML = Object.keys(blMap).map(k=>{
    const bl=blMap[k]; const c=cur[k]||{s:bl[0],e:bl[1],we:0,wb:1};
    const pct = (c.we/ (acts.filter(a=>a.wbs1===k).reduce((s,a)=>s+a.budget,0)||1) *100);
    return `<tr><td>${k}</td><td>${fmtDate(bl[0])}</td><td>${fmtDate(bl[1])}</td><td>${fmtDate(c.s)} → ${fmtDate(c.e)}</td><td>${pct.toFixed(0)}%</td></tr>`;
  }).join('');
})();
